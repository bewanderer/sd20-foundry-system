name: Release Foundry System

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify system.json version matches tag
        run: |
          MANIFEST_VERSION=$(jq -r .version system.json)
          if [ "$MANIFEST_VERSION" != "${{ steps.get_version.outputs.version }}" ]; then
            echo "system.json version '$MANIFEST_VERSION' does not match tag '${{ steps.get_version.outputs.version }}'"
            exit 1
          fi

      - name: Build release manifest and zip
        run: |
          mkdir -p dist
          jq --arg m "https://github.com/${{ github.repository }}/releases/latest/download/system.json" \
             --arg d "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/souls-d20.zip" \
             '.manifest = $m | .download = $d' system.json > dist/system.json
          cp dist/system.json system.json
          zip -r dist/souls-d20.zip . -x "*.git*" -x ".github/*" -x "dist/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/system.json
            dist/souls-d20.zip
          generate_release_notes: true

      - name: Publish to Foundry package registry
        uses: cs96and/FoundryVTT-release-package@v1
        with:
          package-token: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          manifest-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/system.json
